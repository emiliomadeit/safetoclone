# Checks the scoring engine still works on every change.
name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node test/score.test.mjs
      - run: node test/mcp.test.mjs
      - run: node test/instagram.test.mjs
      - run: node test/share.test.mjs
      - run: node test/seo.test.mjs
      - run: node test/hq.test.mjs
      - run: node test/stats.test.mjs
      - run: node test/batch.test.mjs
      - run: node test/newsletter.test.mjs
      - run: node test/sandbox.test.mjs
      - run: node test/sandbox-sync.test.mjs
